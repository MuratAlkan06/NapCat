# XcodeGen spec for NapCat Phone, the iOS receiver (F3). This file is the
# source of truth; NapCatPhone.xcodeproj is GENERATED from it and committed so
# the app builds with Xcode alone. After editing this file run, from this
# directory, `xcodegen generate` and commit both. Never hand-edit the
# .xcodeproj.
#
# The app's own sources are a synchronized folder (Xcode 16+), so adding or
# removing a Swift file under NapCatPhone/ does not change the project file.
name: NapCatPhone
options:
  bundleIdPrefix: com.muratalkan.napcat
  deploymentTarget:
    iOS: "18.0"
  projectFormat: xcode16_0
  createIntermediateGroups: false
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    # The phone app's own version line, independent of the Mac app's 1.x.
    # CURRENT_PROJECT_VERSION goes up by 1 for every TestFlight upload.
    # TestFlight builds get no vX.Y.Z tag.
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  # The repository root. Only its `NapCatWire` product (the wire contract
  # and the pure approval core: zero imports, no I/O) is linked; the Mac
  # app's targets are never built here.
  NapCat:
    path: ../..
targets:
  NapCatPhone:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: NapCatPhone
        type: syncedFolder
      # The repository's own committed art, referenced in place (never
      # copied): the grooming-cat source drawing.
      - path: ../../art/groom-source.png
        group: RepoArt
        buildPhase: resources
    dependencies:
      - package: NapCat
        product: NapCatWire
    # The F3 receive path: CloudKit (the container the Mac writes, private
    # database) plus APNs for the subscription's pushes. xcodegen writes this
    # file from the properties below; commit it with the project. The
    # unsigned simulator path (CODE_SIGNING_ALLOWED=NO) applies none of it,
    # and simulator builds never build a CloudKit container (LiveCapability).
    # No background modes (the frozen F3 ADR): the subscription's pushes are
    # alerts the system renders, never silent wakes, and the list catches up
    # on open.
    entitlements:
      path: NapCatPhone.entitlements
      properties:
        # Development for every dev-signed build; Xcode's App Store /
        # TestFlight export rewrites it to production.
        aps-environment: development
        com.apple.developer.icloud-services: [CloudKit]
        # Must equal AlertWire.containerIdentifier (Sources/NapCatWire).
        com.apple.developer.icloud-container-identifiers: [iCloud.com.muratalkan.napcat]
        # THE CLOUDKIT ENVIRONMENT DIAL — see NAPCAT_CLOUDKIT_ENVIRONMENT.
        com.apple.developer.icloud-container-environment: $(NAPCAT_CLOUDKIT_ENVIRONMENT)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.muratalkan.napcat.phone
        PRODUCT_NAME: NapCatPhone
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: NapCat
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        # Export compliance: the app's only encryption is the system's own
        # HTTPS and CloudKit transport, which is exempt. Declaring it here
        # answers App Store Connect's question once instead of per upload.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # The app icon set's name in the app's asset catalog. xcodegen's
        # application preset sets the same value; it is pinned here so the
        # icon wiring does not depend on that default.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        # Which CloudKit environment this build reads: Production, where the
        # Mac writes (its Developer ID profile is Production-only). A
        # dev-signed build would otherwise default to Development; a
        # development profile permits either value. To bootstrap in
        # Development once (Apple: create a subscription in Development and
        # deploy the schema before Production accepts one), override it on
        # the command line: NAPCAT_CLOUDKIT_ENVIRONMENT=Development.
        # UNPROVEN until the device run: which environment a dev-signed build
        # really reaches, and whether Production accepts the subscription.
        NAPCAT_CLOUDKIT_ENVIRONMENT: Production
  # Unit tests (Swift Testing), hosted in the app, run on the simulator.
  NapCatPhoneTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: NapCatPhoneTests
        type: syncedFolder
    dependencies:
      - target: NapCatPhone
      - package: NapCat
        product: NapCatWire
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.muratalkan.napcat.phone.tests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  NapCatPhone:
    build:
      targets:
        NapCatPhone: all
        NapCatPhoneTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NapCatPhoneTests
